name: redesign-ci

on:
  push:
    branches: ["main", "phase-1"]
  pull_request:

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm test
